# Render Blueprint - Deploy all services with one click
# https://render.com/docs/blueprint-spec

services:
  # Frontend - React/Vite Static Site
  - type: web
    name: breatheeasy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://breatheeasy-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend - Node.js/Express API
  - type: web
    name: breatheeasy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Provide a free-tier MongoDB URI or self-hosted MongoDB URL
      - key: OPENAQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: ML_SERVICE_URL
        value: https://breatheeasy-ml.onrender.com
      - key: FRONTEND_URL
        value: https://breatheeasy-frontend.onrender.com
    healthCheckPath: /health

  # ML Service - Python/FastAPI
  - type: web
    name: breatheeasy-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
